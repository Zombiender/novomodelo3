
name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Baixar o repositório
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Organizar estrutura do projeto
      - name: Organizar estrutura do Aura
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Mover($origem, $destino) {
            if (Test-Path $origem -PathType Leaf) {
              $pasta = Split-Path $destino -Parent
              New-Item -ItemType Directory -Force -Path $pasta | Out-Null

              if (-not (Test-Path $destino)) {
                Move-Item -LiteralPath $origem -Destination $destino
                Write-Host "MOVIDO: $origem -> $destino"
              }
            }
          }

          # CORE
          $core = @(
            'config.ts',
            'preferencias.ts',
            'estado.ts',
            'voz.ts',
            'saude.ts',
            'acoes.ts',
            'spotify.ts',
            'spotify-vinculo.ts',
            'ia.ts',
            'reconhecimento.ts',
            'orquestrador.ts',
            'overlay.ts',
            'midia.ts',
            'atalho.ts',
            'arquivos.ts',
            'letras.ts',
            'capa.ts'
          )

          foreach ($arquivo in $core) {
            Mover $arquivo "src/core/$arquivo"
          }

          # INTERFACE
          $ui = @(
            'App.tsx',
            'montar.tsx',
            'Mascote.tsx',
            'RolagemNumero.tsx',
            'index.css'
          )

          foreach ($arquivo in $ui) {
            Mover $arquivo "src/ui/$arquivo"
          }

          # ENTRADAS
          Mover 'main.ts' 'src/main.ts'
          Mover 'welcome.ts' 'src/welcome.ts'

          # TAURI
          Mover 'Cargo.toml' 'src-tauri/Cargo.toml'
          Mover 'build.rs' 'src-tauri/build.rs'
          Mover 'tauri.conf.json' 'src-tauri/tauri.conf.json'
          Mover 'lib.rs' 'src-tauri/src/lib.rs'
          Mover 'main.rs' 'src-tauri/src/main.rs'
          Mover 'default.json' 'src-tauri/capabilities/default.json'

          # VALIDAR ARQUIVOS
          $obrigatorios = @(
            'package.json',
            'index.html',
            'welcome.html',
            'app-icon.png',
            'src/main.ts',
            'src/welcome.ts',
            'src/ui/montar.tsx',
            'src/ui/App.tsx',
            'src/ui/index.css',
            'src/core/config.ts',
            'src/core/preferencias.ts',
            'src-tauri/Cargo.toml',
            'src-tauri/build.rs',
            'src-tauri/tauri.conf.json'
          )

          $faltando = @()

          foreach ($arquivo in $obrigatorios) {
            if (Test-Path $arquivo -PathType Leaf) {
              Write-Host "OK: $arquivo"
            }
            else {
              Write-Host "AUSENTE: $arquivo"
              $faltando += $arquivo
            }
          }

          if ($faltando.Count -gt 0) {
            throw "Estrutura incompleta. Arquivos ausentes: $($faltando -join ', ')"
          }

          # VALIDAR IMPORTS CRÍTICOS
          $main = Get-Content 'src/main.ts' -Raw
          $config = Get-Content 'src/core/config.ts' -Raw

          if ($main -notmatch '\./ui/montar') {
            throw "Import ./ui/montar não encontrado em src/main.ts"
          }

          if ($config -notmatch '\./preferencias') {
            throw "Import ./preferencias não encontrado em src/core/config.ts"
          }

          Write-Host "ESTRUTURA DO AURA VALIDADA!"

      # 3. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # 4. Configurar Rust
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      # 5. Cache Rust
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 6. Instalar dependências
      - name: Instalar dependências
        run: npm install

      # 7. Gerar ícones
      - name: Gerar ícones
        run: npx tauri icon app-icon.png

      # 8. Configurar variáveis de ambiente
      - name: Configurar ambiente
        shell: pwsh
        env:
          VITE_NOME_ASSISTENTE: ${{ secrets.VITE_NOME_ASSISTENTE }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ secrets.VITE_GEMINI_MODEL }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REFRESH_TOKEN: ${{ secrets.VITE_SPOTIFY_REFRESH_TOKEN }}
          VITE_CHAVE_PIX: ${{ secrets.VITE_CHAVE_PIX }}
        run: |
          @"
          VITE_NOME_ASSISTENTE=$env:VITE_NOME_ASSISTENTE
          VITE_GEMINI_API_KEY=$env:VITE_GEMINI_API_KEY
          VITE_GEMINI_MODEL=$env:VITE_GEMINI_MODEL
          VITE_SPOTIFY_CLIENT_ID=$env:VITE_SPOTIFY_CLIENT_ID
          VITE_SPOTIFY_REFRESH_TOKEN=$env:VITE_SPOTIFY_REFRESH_TOKEN
          VITE_CHAVE_PIX=$env:VITE_CHAVE_PIX
          "@ | Set-Content -Path .env -Encoding utf8

      # 9. Compilar frontend
      - name: Compilar frontend
        run: npm run build

      # 10. Compilar Tauri
      - name: Compilar Aura Windows
        run: npm run tauri build

      # 11. Publicar instalador
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aura-instalador-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
